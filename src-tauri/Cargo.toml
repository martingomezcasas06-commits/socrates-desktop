[package]
name = "socrates"
version = "0.1.0"
description = "Socrates — your team's AI mentor"
authors = ["Martin Gomez"]
edition = "2021"

[lib]
name = "socrates_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
xcap = "0.9"
base64 = "0.22"
image = "0.25"
# Native HTTPS for the realtime SDP handshake — the WKWebView blocks that
# cross-origin POST to api.openai.com (surfaces only as "TypeError: Load failed").
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Windows and Linux deliver a `socrates://` link by starting a SECOND process with
# the URL as an argument. This forwards it to the running instance (the "deep-link"
# feature re-emits it there as an onOpenUrl event) and exits the duplicate.
# macOS hands links to the running app itself, so it doesn't need this.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

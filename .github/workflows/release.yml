name: release

# Builds macOS + Windows into ONE GitHub Release, and publishes the `latest.json`
# manifest the in-app updater polls. Both platforms must land in the same release:
# the updater reads a single manifest, so splitting them across two releases (as the
# old windows-only workflow did) means one platform can never see its own update.
#
# To ship a build:
#   1. bump "version" in src-tauri/tauri.conf.json   (updates only fire on a HIGHER version)
#   2. commit, then:  git tag v0.1.1 && git push --tags
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY  contents of ~/.tauri/socrates-updater.key
#
# The key carries no passphrase, and GitHub will not store an empty secret, so the
# password is set to "" in the job below.
#
# Optional: Apple Developer ID signing + notarization for the macOS build. If
# APPLE_CERTIFICATE is missing, macOS still builds, just unsigned (Gatekeeper warns).
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12:
#                                 base64 -i cert.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD  the .p12's export password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_API_ISSUER            App Store Connect API key: Issuer ID
#   APPLE_API_KEY               App Store Connect API key: Key ID
#   APPLE_API_KEY_P8            the AuthKey_XXXX.p8 file's full text
# Without the three APPLE_API_* secrets the build is signed but not notarized.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads — covers Apple Silicon and Intel.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # rustls pulls in aws-lc-sys, whose Windows build assembles with NASM. The runner
      # does not ship it, so without this the Windows job fails in a C build script.
      - name: Set up NASM (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Exports the Apple variables only when the secrets exist. Tauri keys off the
      # variable being present, so an unset secret must stay absent, not blank.
      - name: Load Apple signing credentials (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set: the macOS build will be unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]')"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::App Store Connect API key not set: signed but NOT notarized."
          fi

      - name: Build, sign the update, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key has no passphrase, and GitHub refuses to store an
          # empty secret — so this is set literally rather than read from one.
          # If the key is ever regenerated WITH a passphrase, put it in a secret
          # named TAURI_SIGNING_PRIVATE_KEY_PASSWORD and read it here instead.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: "Socrates __VERSION__"
          releaseBody: "Install the .dmg on macOS or the .exe on Windows. Existing installs update themselves."
          releaseDraft: false
          # A manual run is a test build: keep it out of "latest" so it cannot be served
          # to installed apps as an update.
          prerelease: ${{ github.ref_type != 'tag' }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

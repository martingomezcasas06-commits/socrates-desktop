name: build-windows

# Build the Windows installer on a Windows runner (this can't be cross-compiled from
# macOS — Tauri needs the MSVC toolchain + WebView2). Triggers when a `win-v*` tag is
# pushed, or manually. Publishes the .exe/.msi to a GitHub Release tagged `windows-latest`.
on:
  push:
    tags:
      - "win-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build app + publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: windows-latest
          releaseName: "Socrates for Windows"
          releaseBody: "Windows installer for the Socrates desktop app. Download the `.exe` (NSIS) installer."
          releaseDraft: false
          prerelease: false
